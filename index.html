<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NutriFit</title>

<!-- PWA / iOS fullscreen standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NutriFit">
<meta name="theme-color" content="#f4f6f5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
:root{
  --bg:#f4f6f5; --bg2:#ffffff; --card:#ffffff; --card2:#eef1ef;
  --border:#e2e7e4; --text:#1b201d; --muted:#7c8983;
  --accent:#12875e; --accent-l:#0e6b4b; --accent2:#22e3a0;
  --good:#1f9d63; --normal:#c07a1f; --bad:#c9564a;
  --radius:16px;
  --shadow:0 1px 2px rgba(20,30,25,.05), 0 10px 24px rgba(20,30,25,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
/* El padding-top de seguridad va en cada barra fija/sticky (no en body), porque
   una vez el header se queda "pegado" arriba al hacer scroll, el padding del
   body ya no cuenta y el contenido queda debajo del reloj/batería del iPhone. */
input,select,textarea,button{font-family:inherit; color:inherit;}
input[type=range], input[type=checkbox], input[type=radio]{accent-color:var(--accent);}
.hidden{display:none !important;}
button{cursor:pointer; border:none;}

/* ---------- LOGIN ---------- */
#login-view{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; padding-top:calc(24px + env(safe-area-inset-top)); padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.login-card{width:100%; max-width:360px; text-align:center;}
.login-card h1{margin:0 0 28px; font-size:34px; font-weight:800; letter-spacing:-0.02em;}
.login-card .user-label{display:block; text-align:left; font-size:13px; color:var(--muted); margin:0 0 6px;}
#username-input{
  width:100%; padding:14px; border-radius:12px; border:1px solid var(--border);
  background:var(--card); font-size:16px; margin-bottom:12px;
}
#username-input:focus{outline:none; border-color:var(--accent);}
#login-btn{
  width:100%; padding:14px; border-radius:12px; background:var(--accent);
  color:#fff; font-weight:600; font-size:16px;
}
#known-users{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;}
.user-pill{
  padding:8px 14px; background:var(--card); border:1px solid var(--border);
  border-radius:999px; font-size:14px;
}

/* ---------- APP SHELL ---------- */
.appbar{
  display:flex; align-items:center; padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  position:sticky; top:0; background:var(--bg); z-index:5;
}
.icon-btn-plain{
  background:none; border:none; padding:8px; margin:-8px; border-radius:10px; color:var(--text);
  display:flex; align-items:center; justify-content:center;
}
.icon-btn-plain:active{background:var(--card2);}

.drawer-overlay{position:fixed; inset:0; background:rgba(20,30,25,.28); z-index:14;}
.drawer{
  position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; z-index:15;
  background:var(--bg2); padding:26px 18px 18px; display:flex; flex-direction:column;
  transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow);
  padding-top:calc(26px + env(safe-area-inset-top)); padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
.drawer.open{transform:translateX(0);}
.drawer-brand{font-size:20px; font-weight:800; letter-spacing:-.02em; margin-bottom:36px;}
.drawer-nav{display:flex; flex-direction:column; gap:8px; flex:1;}
.drawer-link{
  display:flex; align-items:center; gap:16px; padding:18px 14px; border-radius:14px;
  background:var(--card2); border:1px solid var(--border); color:var(--text); font-size:20px; font-weight:800; text-align:left; width:100%;
}
.drawer-link svg{flex-shrink:0; color:var(--accent); width:26px; height:26px;}
.drawer-link.active{background:rgba(18,135,94,.12); border-color:rgba(18,135,94,.35); color:var(--accent);}
.drawer-link.active svg{color:var(--accent);}
.drawer-footer{
  display:flex; align-items:center; justify-content:space-between; padding-top:14px;
  border-top:1px solid var(--border); font-size:14px; color:var(--muted);
}

.section-title{font-size:22px; font-weight:800; letter-spacing:-.01em; margin:2px 0 16px;}

main{padding:16px; max-width:900px; margin:0 auto; padding-bottom:80px;}
.app-section{display:none;}
.app-section.active{display:block;}

/* ---------- GALLERY ---------- */
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
.dish-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column;
}
.dish-thumb{
  width:100%; aspect-ratio:1/1; background:var(--card2); display:flex; align-items:center;
  justify-content:center; color:var(--muted); object-fit:cover;
}
.dish-thumb-empty svg{width:32px; height:32px;}
.dish-info{padding:8px 10px;}
.dish-info .name{font-weight:600; font-size:14px; display:block; margin-bottom:4px;}
.quality-badge{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600;}
.quality-bueno{background:rgba(31,157,99,.13); color:var(--good);}
.quality-normal{background:rgba(192,122,31,.13); color:var(--normal);}
.quality-malo{background:rgba(201,86,74,.13); color:var(--bad);}

.fab{
  position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom));
  width:54px; height:54px; border-radius:50%; background:var(--accent2); color:#0a2e22;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  z-index:6;
}

/* ---------- MODAL ---------- */
.modal{position:fixed; inset:0; background:rgba(20,25,23,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{
  width:100%; max-width:560px; max-height:min(86vh, calc(100vh - 70px - env(safe-area-inset-top)));
  overflow-y:auto; background:var(--bg2); touch-action:pan-y;
  border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
.sheet-kicker{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:10px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.field input[type=text], .field input[type=number], .field textarea, .field select{
  width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); background:var(--card); font-size:15px;
}
.field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--accent);}
.field textarea{min-height:80px; resize:vertical;}
.pill-group{display:flex; gap:8px;}
.pill-btn{flex:1; padding:10px; border-radius:10px; background:var(--card); border:1px solid var(--border); color:var(--muted); font-weight:600;}
.pill-btn.active[data-q="bueno"]{background:rgba(31,157,99,.14); border-color:var(--good); color:var(--good);}
.pill-btn.active[data-q="normal"]{background:rgba(192,122,31,.14); border-color:var(--normal); color:var(--normal);}
.pill-btn.active[data-q="malo"]{background:rgba(201,86,74,.14); border-color:var(--bad); color:var(--bad);}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.btn-primary{flex:1; background:var(--accent); color:#fff; padding:13px; border-radius:12px; font-weight:600; font-size:15px;}
.btn-secondary{
  background:var(--card); color:var(--muted); padding:13px 16px; border-radius:12px; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-danger{background:none; color:var(--bad); padding:13px; font-size:14px;}

/* ---------- DISH SHEET ---------- */
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
.dish-photo-wrap{
  position:relative; width:100%; aspect-ratio:4/3; border-radius:16px; overflow:hidden;
  background:var(--card2); margin-bottom:14px; border:1px solid var(--border);
}
.dish-photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.dish-photo-placeholder{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; color:var(--muted); font-size:13px;
}
.dish-photo-wrap.has-photo .dish-photo-placeholder{display:none;}
.dish-name-input{
  width:100%; border:none; background:none; font-size:21px; font-weight:700; color:var(--text);
  padding:4px 2px 12px; border-bottom:1px solid var(--border); margin-bottom:16px;
}
.dish-name-input:focus{outline:none; border-color:var(--accent);}
.dish-meta-row{display:flex; gap:8px; margin-bottom:20px; align-items:stretch;}
.meta-chip{
  background:var(--card2); border:1px solid var(--border); border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted);
  padding:0 8px; text-align:center; min-width:0;
}
.meta-desc{flex:1.3;}
.meta-desc span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
.meta-desc.filled{color:var(--text);}
.meta-kcal{flex:0.8; flex-direction:column; padding:6px 4px;}
.meta-kcal input{width:100%; border:none; background:none; text-align:center; font-size:14px; color:var(--text); padding:4px 0 0;}
.meta-kcal input:focus{outline:none;}
.meta-kcal-unit{font-size:9px; color:var(--muted); letter-spacing:.02em;}
.dish-meta-row .pill-group{flex:1.7; gap:4px;}
.dish-meta-row .pill-btn{padding:0; font-size:11px; border-radius:10px;}
.ingredient-row{position:relative; overflow:hidden; border-radius:10px; margin-bottom:8px;}
.ingredient-delete-bg{
  position:absolute; inset:0; background:var(--bad); color:#fff; font-size:13px; font-weight:600;
  display:flex; align-items:center; justify-content:flex-end; padding-right:16px;
}
.ingredient-input{
  position:relative; width:100%; background:var(--card2); border:1px solid var(--border);
  border-radius:10px; padding:11px; font-size:15px; color:var(--text);
}
.ingredient-input:focus{outline:none; border-color:var(--accent);}

.desc-modal-overlay{align-items:center; padding:24px; z-index:25;}
.desc-modal-card{width:100%; max-width:420px; background:var(--bg2); border-radius:18px; padding:18px; box-shadow:var(--shadow);}
.desc-modal-card textarea{
  width:100%; min-height:220px; border:none; background:none; font-size:15px; color:var(--text);
  resize:vertical; outline:none;
}

/* ---------- FITNESS ---------- */
.subtabs{display:flex; gap:8px; margin-bottom:16px;}
.subtab{flex:1; padding:10px; border-radius:10px; background:var(--card); border:1px solid var(--border); color:var(--muted); font-weight:600; font-size:13px;}
.subtab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.subpanel{display:none;}
.subpanel.active{display:block;}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.days-toggle{display:flex; gap:6px; flex-wrap:wrap;}
.day-btn{width:40px; height:40px; border-radius:50%; background:var(--card2); border:1px solid var(--border); color:var(--muted); font-weight:600; font-size:13px;}
.day-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
.summary-item{background:var(--card2); border-radius:12px; padding:10px 12px;}
.summary-item .label{font-size:11px; color:var(--muted);}
.summary-item .value{font-size:18px; font-weight:700;}

.week-board{display:flex; gap:10px; overflow-x:auto; padding-bottom:8px;}
.day-col{min-width:190px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px; flex:0 0 auto;}
.day-col.training{border-color:var(--accent2); box-shadow:0 0 0 1px var(--accent2) inset;}
.day-col .day-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.day-col .day-name{font-weight:700; font-size:14px;}
.day-col .day-badge{font-size:9px; font-weight:700; color:#0a6b47; background:rgba(34,197,94,.14); padding:2px 8px; border-radius:999px; letter-spacing:.03em;}
.meal-row{margin-bottom:8px;}
.meal-row label{font-size:11px; color:var(--muted); display:flex; justify-content:space-between;}
.meal-row input{width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--card2); font-size:14px; margin-top:3px;}
.day-total{margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:13px; display:flex; justify-content:space-between; font-weight:700;}
.drinks-box{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
.drinks-box .label{font-size:11px; color:var(--muted); margin-bottom:6px;}
.drink-chip{display:flex; justify-content:space-between; align-items:center; font-size:12px; background:var(--card2); border-radius:8px; padding:5px 8px; margin-bottom:5px;}
.drink-chip button{background:none; color:var(--bad); font-size:14px;}
.add-drink-row{display:flex; gap:5px;}
.add-drink-row select, .add-drink-row input{padding:6px; border-radius:8px; border:1px solid var(--border); background:var(--card2); font-size:12px;}
.add-drink-row select{flex:2;}
.add-drink-row input{flex:1; width:44px;}
.add-drink-row button{background:var(--accent); color:#fff; border-radius:8px; padding:0 10px; font-size:16px;}

.log-history{width:100%; border-collapse:collapse; font-size:13px;}
.log-history th,.log-history td{padding:8px 6px; text-align:left; border-bottom:1px solid var(--border);}
.log-history th{color:var(--muted); font-weight:600; font-size:11px;}
.delta-up{color:var(--bad);} .delta-down{color:var(--good);}

.empty-hint{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view">
  <div class="login-card">
    <h1>NutriFit</h1>
    <label class="user-label" for="username-input">Usuario</label>
    <input id="username-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="login-btn">Entrar</button>
    <div id="known-users"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-view" class="hidden">
  <header class="appbar">
    <button id="menu-btn" class="icon-btn-plain" aria-label="Menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <div id="drawer-overlay" class="drawer-overlay hidden"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-brand">NutriFit</div>
    <nav class="drawer-nav">
      <button class="drawer-link" data-section="platos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
        <span>Platos y Recetas</span>
      </button>
      <button class="drawer-link" data-section="fitness">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-12 2 6h6"/></svg>
        <span>Fitness</span>
      </button>
    </nav>
    <div class="drawer-footer">
      <span id="drawer-username"></span>
      <button id="logout-btn" class="icon-btn-plain" aria-label="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main>
    <!-- PLATOS -->
    <section id="section-platos" class="app-section">
      <div class="section-title">Platos y Recetas</div>
      <div class="gallery" id="gallery"></div>
      <button class="fab" id="add-dish-btn" aria-label="Nuevo plato">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </section>

    <!-- FITNESS -->
    <section id="section-fitness" class="app-section">
      <div class="section-title">Fitness</div>
      <nav class="subtabs">
        <button class="subtab active" data-sub="setup">Setup</button>
        <button class="subtab" data-sub="week">Semana actual</button>
        <button class="subtab" data-sub="log">Log</button>
      </nav>

      <!-- SETUP -->
      <div id="sub-setup" class="subpanel active">
        <form id="setup-form" class="card">
          <div class="row2">
            <div class="field"><label>Altura (cm)</label><input type="number" id="f-height" autocomplete="off" required></div>
            <div class="field"><label>Peso (kg)</label><input type="number" step="0.1" id="f-weight" autocomplete="off" required></div>
          </div>
          <div class="row2">
            <div class="field"><label>Edad</label><input type="number" id="f-age" autocomplete="off" required></div>
            <div class="field"><label>Sexo</label>
              <select id="f-sex"><option value="hombre">Hombre</option><option value="mujer">Mujer</option></select>
            </div>
          </div>
          <div class="field">
            <label>Nivel de actividad física</label>
            <select id="f-activity">
              <option value="sedentario">Sedentario (poco o ningún ejercicio)</option>
              <option value="ligero">Ligero (1-3 días/semana)</option>
              <option value="moderado">Moderado (3-5 días/semana)</option>
              <option value="alto">Alto (6-7 días/semana)</option>
            </select>
          </div>
          <div class="field">
            <label>Objetivo</label>
            <select id="f-goal">
              <option value="perder_rapido">Perder peso (rápido)</option>
              <option value="perder">Perder peso (moderado)</option>
              <option value="mantener">Mantener peso</option>
              <option value="recomposicion">Recomposición corporal</option>
              <option value="ganar">Ganar músculo (moderado)</option>
              <option value="ganar_rapido">Ganar músculo (rápido)</option>
            </select>
          </div>
          <div class="field">
            <label>Días de entreno</label>
            <div class="days-toggle" id="days-toggle">
              <button type="button" class="day-btn" data-day="1">L</button>
              <button type="button" class="day-btn" data-day="2">M</button>
              <button type="button" class="day-btn" data-day="3">X</button>
              <button type="button" class="day-btn" data-day="4">J</button>
              <button type="button" class="day-btn" data-day="5">V</button>
              <button type="button" class="day-btn" data-day="6">S</button>
              <button type="button" class="day-btn" data-day="7">D</button>
            </div>
          </div>
          <button type="submit" class="btn-primary">Guardar y calcular</button>
        </form>

        <div id="setup-summary" class="card hidden">
          <div style="font-weight:700; margin-bottom:4px;">Resumen</div>
          <div class="summary-grid">
            <div class="summary-item"><div class="label">IMC</div><div class="value" id="sum-bmi">-</div></div>
            <div class="summary-item"><div class="label">TMB</div><div class="value" id="sum-tmb">-</div></div>
            <div class="summary-item"><div class="label">Mantenimiento</div><div class="value" id="sum-maint">-</div></div>
            <div class="summary-item"><div class="label">Objetivo kcal/día</div><div class="value" id="sum-target">-</div></div>
            <div class="summary-item"><div class="label">Entrenos/semana</div><div class="value" id="sum-days">-</div></div>
          </div>
        </div>
      </div>

      <!-- WEEK -->
      <div id="sub-week" class="subpanel">
        <div id="week-target-hint" class="card hidden" style="padding:10px 16px; font-size:13px; color:var(--muted);"></div>
        <div class="week-board" id="week-board"></div>
      </div>

      <!-- LOG -->
      <div id="sub-log" class="subpanel">
        <div class="card">
          <div style="font-weight:700; margin-bottom:10px;">Cerrar semana actual</div>
          <div class="field"><label>Peso actual (kg)</label><input type="number" step="0.1" id="close-weight" autocomplete="off"></div>
          <button id="close-week-btn" class="btn-primary">Guardar semana</button>
        </div>
        <div class="card">
          <div style="font-weight:700; margin-bottom:10px;">Evolución</div>
          <svg id="weight-chart" width="100%" height="120" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
          <table class="log-history" id="log-table">
            <thead><tr><th>Semana</th><th>Peso</th><th>Kcal totales</th><th>Media/día</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ================= DISH MODAL ================= -->
<div id="dish-modal" class="modal hidden">
  <div class="modal-sheet">

/* --- Gesto: abrir el menú deslizando desde el borde izquierdo, cerrarlo deslizando a la izquierda --- */
function attachDrawerSwipe(){
  const drawer = $('#drawer'), overlay = $('#drawer-overlay');
  const blockedSelector = 'button, a, input, textarea, select';
  let startX=0, startY=0, dx=0, dragging=false, mode=null, pointerId=null, width=300;

  function onMove(e){
    if(e.pointerId!==pointerId) return;
    const mdx=e.clientX-startX, mdy=e.clientY-startY;
    if(!dragging){
      if(Math.abs(mdx)<10 && Math.abs(mdy)<10) return;
      if(Math.abs(mdy)>Math.abs(mdx)){ release(); return; }
      dragging=true;
      drawer.style.transition='none';
      overlay.classList.remove('hidden');
      overlay.style.transition='none';
    }
    e.preventDefault();
    if(mode==='open'){
      dx = Math.min(width, Math.max(0, mdx));
      drawer.style.transform = `translateX(${dx-width}px)`;
      overlay.style.opacity = String(dx/width);
    } else {
      dx = Math.min(0, Math.max(-width, mdx));
      drawer.style.transform = `translateX(${dx}px)`;
      overlay.style.opacity = String(1 + dx/width);
    }
  }
  function release(){
    document.removeEventListener('pointermove', onMove);
    pointerId = null;
  }
  function onUp(){
    release();
    if(!dragging){ mode=null; return; }
    const willOpen = mode==='open' ? dx > width*0.35 : !(Math.abs(dx) > width*0.3);
    drawer.style.transition='transform .22s ease';
    overlay.style.transition='opacity .22s ease';
    if(willOpen){ drawer.style.transform='translateX(0)'; overlay.style.opacity='1'; }
    else { drawer.style.transform=`translateX(-${width}px)`; overlay.style.opacity='0'; }
    setTimeout(()=>{
      drawer.style.transition=''; drawer.style.transform='';
      overlay.style.transition=''; overlay.style.opacity='';
      drawer.classList.toggle('open', willOpen);
      overlay.classList.toggle('hidden', !willOpen);
    }, 220);
    dragging=false; mode=null;
  }
  document.addEventListener('pointerdown', e=>{
    if($('#app-view').classList.contains('hidden')) return;
    if(!$('#dish-modal').classList.contains('hidden') || !$('#desc-modal').classList.contains('hidden')) return;
    const isOpen = drawer.classList.contains('open');
    if(!isOpen){
      if(e.clientX>28 || e.target.closest('.week-board')) return;
      mode='open';
    } else {
      if(e.target.closest(blockedSelector)) return;
      if(!drawer.contains(e.target)) return;
      mode='close';
    }
    startX=e.clientX; startY=e.clientY; dx=0; dragging=false;
    pointerId=e.pointerId;
    width = drawer.getBoundingClientRect().width || 300;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp, {once:true});
    document.addEventListener('pointercancel', onUp, {once:true});
  });
}

/* --- Gesto: deslizar la ficha de plato (a la derecha o hacia abajo) para volver atrás --- */
function attachSwipeToCloseSheet(sheet, onClose){
  const blockedSelector = 'input, textarea, button, .ingredient-row, .dish-photo-wrap, .pill-btn';
  let startX=0, startY=0, dx=0, dy=0, dir=null, dragging=false, pointerId=null;

  function onMove(e){
    if(e.pointerId!==pointerId) return;
    const mdx=e.clientX-startX, mdy=e.clientY-startY;
    if(!dragging){
      if(Math.abs(mdx)<10 && Math.abs(mdy)<10) return;
      if(mdx>Math.abs(mdy)){ dir='right'; dragging=true; }
      else if(mdy>Math.abs(mdx) && sheet.scrollTop<=0){ dir='down'; dragging=true; }
      else { endDrag(false); return; }
    }
    e.preventDefault();
    if(dir==='right'){ dx = Math.max(0, mdx); sheet.style.transform = `translateX(${dx}px)`; }
    else { dy = Math.max(0, mdy); sheet.style.transform = `translateY(${dy}px)`; }
    const dist = dir==='right' ? dx : dy;
    sheet.style.opacity = String(Math.max(0.4, 1 - dist/380));
  }
  function endDrag(shouldEval){
    if(pointerId!=null){
      sheet.removeEventListener('pointermove', onMove);
      try{ sheet.releasePointerCapture(pointerId); }catch(err){}
    }
    pointerId = null;
    if(!dragging){ dir=null; return; }
    const dist = dir==='right' ? dx : dy;
    if(shouldEval!==false && dist > 90){
      sheet.style.transition = 'transform .2s ease, opacity .2s ease';
      sheet.style.transform = dir==='right' ? 'translateX(100%)' : 'translateY(100%)';
      sheet.style.opacity = '0';
      setTimeout(()=>{ onClose(); sheet.style.transition=''; sheet.style.transform=''; sheet.style.opacity=''; }, 200);
    } else {
      sheet.style.transition = 'transform .18s ease, opacity .18s ease';
      sheet.style.transform = 'translateX(0)';
      sheet.style.opacity = '1';
      setTimeout(()=> sheet.style.transition = '', 180);
    }
    dragging = false; dir = null;
  }
  sheet.addEventListener('pointerdown', e=>{
    if(e.target.closest(blockedSelector)) return;
    startX=e.clientX; startY=e.clientY; dx=0; dy=0; dir=null; dragging=false;
    pointerId = e.pointerId;
    sheet.setPointerCapture(pointerId);
    sheet.addEventListener('pointermove', onMove);
  });
  sheet.addEventListener('pointerup', ()=> endDrag());
  sheet.addEventListener('pointercancel', ()=> endDrag(false));
}
attachSwipeToCloseSheet(document.querySelector('#dish-modal .modal-sheet'), closeDishModal);

/* --- Ingredientes: sin botón "+", Enter crea fila nueva, swipe a la izquierda borra --- */
function addIngredientRow(value='', afterRow=null){
  const row = document.createElement('div');
  row.className = 'ingredient-row';
  row.innerHTML = `
    <div class="ingredient-delete-bg">Eliminar</div>
    <input type="text" class="ingredient-input" value="${escapeHtml(value)}"
      autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  const input = row.querySelector('input');
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const newRow = addIngredientRow('', row);
      newRow.querySelector('input').focus();
    }
  });
  attachSwipeToDelete(row);
  if(afterRow){ afterRow.after(row); } else { $('#ingredients-list').appendChild(row); }
  return row;
}
function attachSwipeToDelete(row){
  const input = row.querySelector('.ingredient-input');
  input.style.touchAction = 'pan-y';
  let startX=0, startY=0, dx=0, dragging=false, active=false;
  input.addEventListener('pointerdown', e=>{
    startX=e.clientX; startY=e.clientY; dx=0; dragging=false; active=true;
  });
  input.addEventListener('pointermove', e=>{
    if(!active) return;
    const mdx=e.clientX-startX, mdy=e.clientY-startY;
    if(!dragging){
      if(Math.abs(mdx)>8 && Math.abs(mdx)>Math.abs(mdy)){ dragging=true; input.blur(); }
      else if(Math.abs(mdy)>8){ active=false; return; }
    }
    if(dragging){
      dx = Math.min(0, mdx);
      input.style.transform = `translateX(${dx}px)`;
    }
  });
  function endDrag(){
    if(!active) return;
    active = false;
    if(dragging && dx < -70){
      input.style.transition = 'transform .18s ease, opacity .18s ease';
      input.style.transform = 'translateX(-100%)';
      input.style.opacity = '0';
      setTimeout(()=> row.remove(), 180);
    } else if(dragging){
      input.style.transition = 'transform .18s ease';
      input.style.transform = 'translateX(0)';
      setTimeout(()=> input.style.transition = '', 180);
    }
    dragging = false;
  }
  input.addEventListener('pointerup', endDrag);
  input.addEventListener('pointercancel', endDrag);
}

async function uploadDishPhoto(dishId, file){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${currentUser.id}/${dishId}.${ext}`;
  const { error } = await sb.storage.from('dish-photos').upload(path, file, { upsert:true, contentType:file.type });
  if(error) throw error;
  const { data } = sb.storage.from('dish-photos').getPublicUrl(path);
  return data.publicUrl + '?v=' + Date.now();
}

  const name = $('#dish-name').value.trim();

  $('#dish-save-btn').textContent = 'Guardando...';
  try{
    if(dishPhotoFile){ image_url = await uploadDishPhoto(id, dishPhotoFile); }

      id, user_id: currentUser.id, name,
      ingredients, description: $('#dish-desc').value.trim(),
      calories: $('#dish-calories').value ? Number($('#dish-calories').value) : null,
      quality: selectedQuality, image_url
    };
    const { error } = await sb.from('dishes').upsert(payload);
    if(error) throw error;
    closeDishModal();
    await loadDishes();
  }catch(err){ alert('Error guardando: '+err.message); }
  finally{ $('#dish-save-btn').textContent = 'Guardar'; }
};

$('#dish-delete-btn').onclick = async ()=>{

};

const GOAL_OFFSETS = {
  perder_rapido: -500,   // pérdida rápida
  perder: -350,          // pérdida moderada
  mantener: 0,           // mantenimiento puro
  recomposicion: -100,   // recomposición: déficit ligero + proteína/entreno
  ganar: 250,            // ganancia muscular moderada
  ganar_rapido: 450,     // ganancia muscular rápida
};
function computeFitness({height_cm, weight_kg, age, sex, activity_level, goal}){
  const heightM = height_cm/100;
  const bmi = weight_kg / (heightM*heightM);
  let tmb = sex==='hombre'
    ? (10*weight_kg)+(6.25*height_cm)-(5*age)+5
    : (10*weight_kg)+(6.25*height_cm)-(5*age)-161;
  const factors = {sedentario:1.2, ligero:1.375, moderado:1.55, alto:1.725};
  const maintenance = tmb * factors[activity_level];
  const target = maintenance + (GOAL_OFFSETS[goal] ?? 0);
  return { bmi, tmb, maintenance, target };
}

$('#setup-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const trainingDays = $all('#days-toggle .day-btn.active').map(b=> Number(b.dataset.day));
  const payload = {
    height_cm: Number($('#f-height').value),
    weight_kg: Number($('#f-weight').value),
    age: Number($('#f-age').value),
    sex: $('#f-sex').value,
    activity_level: $('#f-activity').value,
    goal: $('#f-goal').value,
    training_days: trainingDays,
  };
  const calc = computeFitness(payload);
  const row = {
    user_id: currentUser.id, ...payload,
    bmi: calc.bmi, tmb: calc.tmb, maintenance_calories: calc.maintenance,
    target_calories: calc.target,
    updated_at: new Date().toISOString()
  };
  const { data, error } = await sb.from('fitness_profiles').upsert(row, {onConflict:'user_id'}).select().single();
  if(error){ alert('Error: '+error.message); return; }
  fitnessProfile = data;
  renderSetupSummary(fitnessProfile);
  renderWeekBoard();
});

function renderSetupSummary(p){
  $('#setup-summary').classList.remove('hidden');
  $('#sum-bmi').textContent = Number(p.bmi).toFixed(1);
  $('#sum-tmb').textContent = Math.round(p.tmb)+' kcal';
  $('#sum-maint').textContent = Math.round(p.maintenance_calories)+' kcal';
  $('#sum-target').textContent = Math.round(p.target_calories)+' kcal';
  $('#sum-days').textContent = (p.training_days||[]).length;
}

/* ===================== FITNESS: SEMANA ACTUAL ===================== */
function computeWeekDates(){
  const monday = getMonday(new Date());
  weekDates = Array.from({length:7}, (_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return d; });
}
async function loadWeekData(){
  computeWeekDates();
  const from = fmtDate(weekDates[0]), to = fmtDate(weekDates[6]);
  const [{data: meals}, {data: drinks}] = await Promise.all([
    sb.from('meal_logs').select('*').eq('user_id', currentUser.id).gte('log_date', from).lte('log_date', to),
    sb.from('drink_logs').select('*').eq('user_id', currentUser.id).gte('log_date', from).lte('log_date', to),
  ]);
  weekMeals = {}; (meals||[]).forEach(m=> weekMeals[`${m.log_date}|${m.meal_type}`] = m);
  weekDrinks = {}; weekDates.forEach(d=> weekDrinks[fmtDate(d)] = []);
  (drinks||[]).forEach(dr=> { (weekDrinks[dr.log_date] ||= []).push(dr); });
}
async function renderWeekBoard(){
  await loadWeekData();
  const trainingDays = fitnessProfile ? (fitnessProfile.training_days||[]) : [];
  if(fitnessProfile){
    $('#week-target-hint').classList.remove('hidden');
    $('#week-target-hint').innerHTML = `Objetivo diario: <b>${Math.round(fitnessProfile.target_calories)} kcal</b> · Reparto orientativo: Desayuno 25% · Comida 35% · Merienda 10% · Cena 30%`;
  }
  const board = $('#week-board');
  board.innerHTML = weekDates.map(d=>{
    const key = fmtDate(d);
    const iso = isoWeekday(d);
    const isTraining = trainingDays.includes(iso);
    const mealsHtml = MEALS.map(m=>{
      const entry = weekMeals[`${key}|${m}`];
      const target = fitnessProfile ? Math.round(fitnessProfile.target_calories * MEAL_SPLIT[m]) : null;
      return `<div class="meal-row">
        <label><span>${MEAL_LABELS[m]}</span>${target?`<span>~${target} kcal</span>`:''}</label>
        <input type="number" data-date="${key}" data-meal="${m}" value="${entry?entry.calories:''}">
      </div>`;
    }).join('');
    const drinksHtml = (weekDrinks[key]||[]).map(dr=>`
      <div class="drink-chip" data-drink-id="${dr.id}">
        <span>${dr.quantity}× ${DRINK_LABELS[dr.category]||dr.category} (${dr.quantity*dr.calories_per_unit} kcal)</span>
        <button data-del-drink="${dr.id}">✕</button>
      </div>`).join('');
    return `<div class="day-col ${isTraining?'training':''}" data-date="${key}">
      <div class="day-head">
        <span class="day-name">${DAY_NAMES[iso]} ${d.getDate()}/${d.getMonth()+1}</span>
        ${isTraining?'<span class="day-badge">ENTRENO</span>':''}
      </div>
      ${mealsHtml}
      <div class="day-total"><span>Total</span><span data-total="${key}">- kcal</span></div>
      <div class="drinks-box">
        <div class="label">Bebidas</div>
        <div data-drinks-list="${key}">${drinksHtml}</div>
        <div class="add-drink-row">
          <select data-drink-cat="${key}">
            <option value="cerveza">Cerveza (110)</option>
            <option value="vino">Vino (120)</option>
            <option value="cubata">Cubata (250)</option>
            <option value="otro">Otro</option>
          </select>
          <input type="number" data-drink-qty="${key}" value="1" min="1">
          <button data-add-drink="${key}">+</button>
        </div>
      </div>
    </div>`;
  }).join('');

  $all('.meal-row input').forEach(inp=> inp.addEventListener('change', onMealInputChange));
  $all('[data-add-drink]').forEach(btn=> btn.onclick = ()=> addDrink(btn.dataset.addDrink));
  $all('[data-del-drink]').forEach(btn=> btn.onclick = ()=> deleteDrink(btn.dataset.delDrink));
  weekDates.forEach(d=> updateDayTotal(fmtDate(d)));
}

async function onMealInputChange(e){
  const date = e.target.dataset.date, meal = e.target.dataset.meal;
  const calories = e.target.value ? Number(e.target.value) : 0;
  const { data, error } = await sb.from('meal_logs')
    .upsert({ user_id: currentUser.id, log_date: date, meal_type: meal, calories }, {onConflict:'user_id,log_date,meal_type'})
    .select().single();
  if(error){ alert(error.message); return; }
  weekMeals[`${date}|${meal}`] = data;
  updateDayTotal(date);
}

async function addDrink(date){
  const sel = document.querySelector(`[data-drink-cat="${date}"]`);
  const qtyInp = document.querySelector(`[data-drink-qty="${date}"]`);
  const category = sel.value;
  const quantity = Number(qtyInp.value)||1;
  let kcalPerUnit = DRINK_KCAL[category];
  if(category==='otro'){
    const custom = prompt('¿Kcal por unidad para "Otro"?', '150');
    if(custom===null) return;
    kcalPerUnit = Number(custom)||150;
  }
  const { data, error } = await sb.from('drink_logs').insert({
    user_id: currentUser.id, log_date: date, category, quantity, calories_per_unit: kcalPerUnit
  }).select().single();
  if(error){ alert(error.message); return; }
  (weekDrinks[date] ||= []).push(data);
  renderWeekBoard();
}
async function deleteDrink(id){
  const { error } = await sb.from('drink_logs').delete().eq('id', id);
  if(error){ alert(error.message); return; }
  renderWeekBoard();
}
function updateDayTotal(date){
  const mealsTotal = MEALS.reduce((s,m)=> s + (weekMeals[`${date}|${m}`]?.calories||0), 0);
  const drinksTotal = (weekDrinks[date]||[]).reduce((s,d)=> s + d.quantity*d.calories_per_unit, 0);
  const total = mealsTotal + drinksTotal;
  const el = document.querySelector(`[data-total="${date}"]`);
  if(!el) return;
  el.textContent = total + ' kcal';
  if(fitnessProfile){
    const target = fitnessProfile.target_calories;
    el.style.color = total > target*1.05 ? 'var(--bad)' : (total < target*0.85 ? 'var(--normal)' : 'var(--good)');
  }
}

/* ===================== FITNESS: LOG ===================== */
$('#close-week-btn').onclick = async ()=>{
  const weight = Number($('#close-weight').value);
  if(!weight){ alert('Introduce el peso actual'); return; }
  await loadWeekData();
  let total = 0;
  weekDates.forEach(d=>{
    const key = fmtDate(d);
    total += MEALS.reduce((s,m)=> s + (weekMeals[`${key}|${m}`]?.calories||0), 0);
    total += (weekDrinks[key]||[]).reduce((s,dr)=> s + dr.quantity*dr.calories_per_unit, 0);
  });
  const week_start = fmtDate(weekDates[0]);
  const { error } = await sb.from('weekly_logs').upsert({
    user_id: currentUser.id, week_start, weight_kg: weight,
    total_calories: total, avg_daily_calories: Math.round(total/7)
  }, {onConflict:'user_id,week_start'});
  if(error){ alert(error.message); return; }
  $('#close-weight').value = '';
  loadWeeklyLogs();
  alert('Semana guardada ✅');
};

async function loadWeeklyLogs(){
  const { data } = await sb.from('weekly_logs').select('*').eq('user_id', currentUser.id).order('week_start', {ascending:true});
  weeklyLogs = data||[];
  renderLogTable();
  renderWeightChart();
}
function renderLogTable(){
  const tbody = document.querySelector('#log-table tbody');
  const rows = [...weeklyLogs].reverse();
  tbody.innerHTML = rows.map((w,i)=>{
    const prev = rows[i+1];
    let delta = '';
    if(prev && prev.weight_kg!=null && w.weight_kg!=null){
      const diff = (w.weight_kg - prev.weight_kg).toFixed(1);
      delta = diff>0 ? `<span class="delta-up">▲${diff}</span>` : (diff<0 ? `<span class="delta-down">▼${Math.abs(diff)}</span>` : '=');
    }
    return `<tr><td>${w.week_start}</td><td>${w.weight_kg??'-'} kg ${delta}</td><td>${w.total_calories??'-'}</td><td>${w.avg_daily_calories??'-'}</td></tr>`;
  }).join('') || '<tr><td colspan="4" style="color:var(--muted)">Sin datos aún</td></tr>';
}
function renderWeightChart(){
  const svg = $('#weight-chart');
  const weights = weeklyLogs.filter(w=>w.weight_kg!=null).map(w=>w.weight_kg);
  if(weights.length<2){ svg.innerHTML=''; return; }
  const min = Math.min(...weights), max = Math.max(...weights);
  const range = (max-min)||1;
  const stepX = 300/(weights.length-1);
  const points = weights.map((w,i)=> `${i*stepX},${110 - ((w-min)/range)*100}`).join(' ');
  svg.innerHTML = `<polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` +
    weights.map((w,i)=> `<circle cx="${i*stepX}" cy="${110 - ((w-min)/range)*100}" r="4.5" fill="var(--accent2)" stroke="#fff" stroke-width="2"/>`).join('');
}

init();
</script>
